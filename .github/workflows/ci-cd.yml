name: CI and GitHub Pages deployment

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Type check and build
    runs-on: ubuntu-latest
    env:
      VITE_BASE_PATH: /PortFolio/
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Check TypeScript
        working-directory: frontend
        run: npm run type-check

      - name: Build production site
        working-directory: frontend
        run: npm run build

      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    name: Deploy GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Wait for the default Pages build
        if: github.event_name == 'push'
        uses: actions/github-script@v7
        with:
          script: |
            const startedAt = Date.now();
            const timeoutMs = 10 * 60 * 1000;

            while (Date.now() - startedAt < timeoutMs) {
              const { data } = await github.rest.actions.listWorkflowRunsForRepo({
                owner: context.repo.owner,
                repo: context.repo.repo,
                head_sha: context.sha,
                per_page: 100,
              });
              const pagesRun = data.workflow_runs.find(
                (run) =>
                  run.name === "pages build and deployment" &&
                  run.head_sha === context.sha
              );

              if (pagesRun?.status === "completed") {
                if (pagesRun.conclusion !== "success") {
                  throw new Error(
                    `Default Pages build ended with ${pagesRun.conclusion}`
                  );
                }
                core.info("Default Pages build completed; deploying the Vite artifact last.");
                return;
              }

              core.info("Waiting for the default Pages build to finish.");
              await new Promise((resolve) => setTimeout(resolve, 5000));
            }

            throw new Error("Timed out while waiting for the default Pages build.");

      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
